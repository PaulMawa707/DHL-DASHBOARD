name: Realtime cron

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh realtime snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DASH_URL: https://mix-vss-mawa-s-projects.vercel.app/api/cron/realtime
        run: |
          set -euo pipefail
          headers=(-H "x-vercel-cron: 1")
          if [ -n "${CRON_SECRET:-}" ]; then
            headers+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          curl -fsS --max-time 240 -X GET "${headers[@]}" "$DASH_URL"
