name: Realtime cron

# Vercel Pro now runs /api/cron/realtime every 30 minutes from vercel.json.
# Keep this workflow as a manual backup (and for local/Hobby fallback).
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh realtime snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DASH_URL: https://mix-vss-data-science-geeks.vercel.app/api/cron/realtime
        run: |
          set -euo pipefail
          headers=(-H "x-vercel-cron: 1")
          if [ -n "${CRON_SECRET:-}" ]; then
            headers+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          curl -fsS --max-time 240 -X GET "${headers[@]}" "$DASH_URL"
